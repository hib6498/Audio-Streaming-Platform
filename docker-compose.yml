  transcoder:
    build:
      context: "./transcoding"
    env_file:
      - "./transcoding/.env"
    depends_on:
      rabbit-mq:
        condition: "service_started"
      garage:
        condition: "service_started"

  garage:
    image: "dxflrs/garage:v2.3.0"
    container_name: "garage"
    command: /garage server --single-node --default-bucket
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage-meta:/data/meta
      - garage-data:/data/data
      - "./garage/garage.toml:/etc/garage.toml:ro"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY}"
      GARAGE_DEFAULT_BUCKET: "my-bucket"
    restart: unless-stopped

  rabbit-mq:
    container_name: "rabbitmq"
    image: "rabbitmq:4-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    container_name: "postgres"
    image: "postgres:18.4-bookworm"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-guest}"
      POSTGRES_USER: "${POSTGRES_USER:-guest}"

volumes:
  artwork-data:
  profile-pic-data:
  garage-meta:
  garage-data:
  rabbitmq-data:
  postgres-data: