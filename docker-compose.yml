name: "audio-streaming"

services:
  config-server:
    build:
      context: "./config"
    environment:
      STORAGE_LOCATION: "/app/images"
      ENCRYPT_KEY: ${ENCRYPT_KEY:?Set ENCRYPT_KEY in .env}
    volumes:
      - "${CONFIG_REPO_PATH}:/config-repo"
    ports:
      - "8888:8888"

